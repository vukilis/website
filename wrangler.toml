name = "website"
compatibility_date = "2026-08-6"
compatibility_flags = ["nodejs_compat"]


[assets]
directory = "./dist"
not_found_handling = "404-page"

[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1